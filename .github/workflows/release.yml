name: release

# Push a tag like v0.1.0 to build stand-alone programs (no Python needed on the
# user's machine) and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Depoloma-windows.exe
            built: dist/Depoloma.exe
            sep: ";"
          - os: macos-latest
            artifact: Depoloma-macos
            built: dist/Depoloma
            sep: ":"
          - os: ubuntu-latest
            artifact: Depoloma-linux
            built: dist/Depoloma
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python -m pip install pyinstaller pillow   # pillow converts the icon where needed
      - name: Build
        shell: bash
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Depoloma
          --icon depoloma/web/icon.ico
          --add-data "depoloma/web${{ matrix.sep }}depoloma/web"
          run_depoloma.py
      - name: Rename
        shell: bash
        run: cp "${{ matrix.built }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact }}
